name: Dominion v4.6.4 real phone-sized Chronicle and old-systems browser QA
on:
  push:
    branches: [dev/v464-gauntlet-chronicle, main]
    paths:
      - tools/v464_browser_qa.mjs
      - v45-engine.js
      - v45-qa-engine.js
      - v46-gauntlet.js
      - v464-chronicle.css
      - index.html
      - v30.html
      - .github/workflows/v464-browser-qa.yml
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  chronicle-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/dominion-v464.log 2>&1 &
      - run: node tools/v464_browser_qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-v464-chronicle-phone-screenshots
          path: |
            art/v464-gauntlet-commander-hall-390px.png
            art/v464-gauntlet-first-encounter-390px.png
            art/v464-mastery-forge-390px.png
            art/v464-gauntlet-narrow-320px.png
          if-no-files-found: ignore
          retention-days: 7
