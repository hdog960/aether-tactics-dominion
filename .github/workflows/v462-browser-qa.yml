name: Dominion v4.6.2 Mastery Codex and contracts mobile QA
on:
  push:
    branches: [dev/v462-mastery-contracts]
    paths:
      - .github/workflows/v462-browser-qa.yml
      - tools/v462_browser_qa.mjs
      - v45-engine.js
      - v45-qa-engine.js
      - v46-gauntlet.js
      - v462-masteries.css
      - index.html
      - v30.html
permissions: {contents: read}
jobs:
  mobile-mastery-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/dominion-v462-local.log 2>&1 &
      - run: node tools/v462_browser_qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-v462-60-card-mastery-mobile-review
          path: |
            art/v462-gauntlet-commander-hall-390px.png
            art/v462-gauntlet-first-encounter-390px.png
            art/v462-mastery-forge-390px.png
            art/v462-gauntlet-narrow-320px.png
          if-no-files-found: ignore
          retention-days: 7
