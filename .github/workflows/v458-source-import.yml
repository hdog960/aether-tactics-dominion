name: Dominion v4.5.8 original four-character source import
on:
  push:
    branches: [dev/v458-sixty-cards]
    paths: [.github/workflows/v458-source-import.yml]
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original 2x2 source PNG
        env:
          SOURCE_URL: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/3dbf684c-63ce-493a-a934-186224b80afc/083d2066-0453-413a-aead-814c4880f788/PRODUCTION_SOURCE_ART_SHEET_ONLY__precisely_ONE_square_image.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzZjMmUyNmVjMTIyZmQ4OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzgwMDgxNH0.1_QouoDKD1i_8B1OkRVch4Ei0SQUvGWLcnzUX0CD0Zc'
        run: |
          set -euo pipefail
          mkdir -p art/sources
          curl -fsSL --retry 3 "$SOURCE_URL" -o art/sources/v458-original-characters.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          path=Path('art/sources/v458-original-characters.png')
          image=Image.open(path);image.verify()
          image=Image.open(path)
          w,h=image.size
          assert min(w,h)>=1024 and abs(w-h)/max(w,h)<.09, (w,h)
          assert path.stat().st_size>150000
          print('Validated original image',image.size)
          PY
      - name: Archive original only on development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/sources/v458-original-characters.png
          git commit -m "Archive original final four painted v4.5.8 character sheet"
          git fetch origin dev/v458-sixty-cards
          git rebase origin/dev/v458-sixty-cards
          git push origin HEAD:dev/v458-sixty-cards
