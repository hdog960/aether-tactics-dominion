name: Dominion v4.5.6 build uploaded original artwork
on:
  push:
    branches: [dev/v456-four-creatures]
    paths:
      - art/sources/v456-original-characters.png
      - tools/v456_build_art.py
      - .github/workflows/v456-build-from-source.yml
permissions: {contents: write}
jobs:
  validate-uploaded-original-art:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev/v456-four-creatures}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 opencv-python-headless==4.10.0.84 pillow==11.3.0
      - name: Verify original source art exists
        run: test -s art/sources/v456-original-characters.png
      - name: Validate real four-figure artwork and build in-game atlases
        run: python tools/v456_build_art.py
      - name: Commit validated painted assets to staging only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/cards-creatures-v456.webp art/units-creatures-v456.png art/battlefield-frames-v456.webp art/v456-art-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Build unique 4-character v4.5.6 painted game assets from original sheet"
            git push origin HEAD:dev/v456-four-creatures
          fi
