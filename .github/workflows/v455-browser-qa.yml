name: Dominion v4.5.5 isolated mobile spell QA
on:
  push:
    branches: [dev/v455-four-tactical-spells]
    paths:
      - .github/workflows/v455-browser-qa.yml
      - tools/v455_browser_qa.mjs
      - art/cards-spells-v455.webp
      - v455-spell-art.js
      - index.html
      - qa-v39.html
      - sw.js
permissions: {contents: read}
jobs:
  test-painted-spells-and-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev/v455-four-tactical-spells}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Launch staged game
        run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/dominion-v455-http.log 2>&1 &
      - name: Verify painted card art, normal collection and actual engine
        run: node tools/v455_browser_qa.mjs
        env:
          V455_RELEASE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-v455-four-painted-spells
          path: |
            art/v455-four-painted-spells-390px.png
            art/v455-real-grimoire-390px.png
          if-no-files-found: ignore
