name: Dominion diagnostic — live public Trystero signaling smoke
on:
  push:
    branches: [dev/v472-peer-handshake]
    paths:
      - tools/v472_public_relay_smoke.mjs
      - .github/workflows/v472-public-relay-smoke.yml
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  public-relay-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/dominion-relay.log 2>&1 &
      - name: Probe live Nostr relays and actual Trystero WebRTC
        continue-on-error: true
        run: node tools/v472_public_relay_smoke.mjs
