name: Dominion v4.5.7 spell mechanics and legacy save CI
on:
  push:
    branches: [dev/v457-four-spells]
    paths:
      - .github/workflows/v457-rules-qa.yml
      - tools/v457_rules_qa.mjs
      - v45-engine.js
      - v45-qa-engine.js
      - DOMINION_ROADMAP.md
      - tools/v457_release_guard.mjs
      - art/v457-spell-manifest.json
      - art/cards-spells-v457.webp
      - art/sources/v457-original-spells.png
      - index.html
      - v30.html
      - qa-v39.html
      - sw.js
      - v457-spell-art.js
permissions: {contents: read}
jobs:
  four-spell-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/v457_rules_qa.mjs
      - run: node tools/v457_release_guard.mjs
      - run: |
          cmp v45-engine.js v45-qa-engine.js
          cmp v45-scene.js v45-qa-scene.js
