name: Dominion v4.7.1 real mobile-size lost ACK and manual resync QA
on:
  push:
    branches: [dev/v471-ack-recovery, main]
    paths:
      - tools/v471_browser_qa.mjs
      - tools/v470_browser_qa.mjs
      - v45-engine.js
      - v45-qa-engine.js
      - v30-net.js
      - v471-ack.css
      - index.html
      - v30.html
      - .github/workflows/v471-browser-qa.yml
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  mobile-ack-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/dominion-v471.log 2>&1 &
      - run: node tools/v471_browser_qa.mjs
      - run: node tools/v470_browser_qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-v471-lost-ack-mobile-qa
          path: art/v471-*.png
          if-no-files-found: ignore
          retention-days: 7
