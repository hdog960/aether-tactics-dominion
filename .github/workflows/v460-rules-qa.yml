name: Dominion v4.6.0 Rift Gauntlet and mastery regression
on:
  push:
    branches: [dev/v460-rift-gauntlet]
    paths:
      - .github/workflows/v460-rules-qa.yml
      - tools/v460_rules_qa.mjs
      - v45-engine.js
      - v45-qa-engine.js
      - DOMINION_ROADMAP.md
permissions: {contents: read}
jobs:
  gauntlet-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/v460_rules_qa.mjs
      - run: |
          cmp v45-engine.js v45-qa-engine.js
          cmp v45-scene.js v45-qa-scene.js
