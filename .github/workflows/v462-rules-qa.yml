name: Dominion v4.6.2 complete Masteries and contracts regression
on:
  push:
    branches: [dev/v462-mastery-contracts]
    paths:
      - .github/workflows/v462-rules-qa.yml
      - tools/v462_rules_qa.mjs
      - v45-engine.js
      - v45-qa-engine.js
      - DOMINION_ROADMAP.md
permissions: {contents: read}
jobs:
  contract-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/v462_rules_qa.mjs
      - run: |
          cmp v45-engine.js v45-qa-engine.js
          cmp v45-scene.js v45-qa-scene.js
