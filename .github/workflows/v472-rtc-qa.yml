name: Dominion v4.7.2 real WebRTC DataChannel gameplay and persistent engine regressions
on:
  push:
    branches: [dev/v472-peer-handshake, main]
    paths:
      - v45-engine.js
      - v45-qa-engine.js
      - tools/v472_rtc_browser_qa.mjs
      - tools/v472_handshake_browser_qa.mjs
      - tools/v472_release_guard.mjs
      - tools/v471_browser_qa.mjs
      - tools/v470_browser_qa.mjs
      - sw.js
      - index.html
      - .github/workflows/v472-rtc-qa.yml
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  real-browser-rtc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/dominion-v472.log 2>&1 &
      - run: node tools/v472_rtc_browser_qa.mjs
      - run: node tools/v472_handshake_browser_qa.mjs
      - run: node tools/v471_browser_qa.mjs
      - run: node tools/v470_browser_qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-v472-real-rtc-and-handshake-qa
          path: art/v472-*.png
          if-no-files-found: ignore
          retention-days: 7
