name: Dominion v4.5.6 creature engine CI
on:
  push:
    branches: [dev/v456-four-creatures]
    paths:
      - .github/workflows/v456-rules-qa.yml
      - tools/v456_rules_qa.mjs
      - tools/v456_release_guard.mjs
      - tools/v456_build_art.py
      - art/sources/v456-original-characters.png
      - art/v456-art-manifest.json
      - art/cards-creatures-v456.webp
      - art/units-creatures-v456.png
      - art/battlefield-frames-v456.webp
      - index.html
      - v30.html
      - sw.js
      - v45-qa-engine.js
      - v45-scene.js
      - v45-qa-scene.js
      - v456-creature-art.js
      - DOMINION_ROADMAP.md
      - tools/v456_save_compatibility_qa.mjs
      - v45-engine.js
      - v30-campaign-data.js
permissions: {contents: read}
jobs:
  creatures-and-saves:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/v456_rules_qa.mjs
      - run: node tools/v456_save_compatibility_qa.mjs
      - run: node tools/v456_release_guard.mjs
