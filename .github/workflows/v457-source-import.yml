name: Dominion v4.5.7 original spell painting source import
on:
  push:
    branches: [dev/v457-four-spells]
    paths: [.github/workflows/v457-source-import.yml]
permissions: {contents: write}
jobs:
  import-reviewed-original:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate original square 2x2 painted scenes
        env:
          SOURCE_URL: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/c6bd9c72-4685-4891-81a5-ce0b9830339a/dddf6a5b-d17c-46fc-b7c1-a220d93e4944/A_SINGLE_square_2_by_2_ORIGINAL_HIGH_FANTASY_PAINTED_SPELL_S.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGY0NTkzNGRlZGViNjM3ZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzc1NDk1N30.JBpcPRVeFTDy7c0aZYChDq2yb0JOv6wo3cKt4sZn9hQ'
        run: |
          set -euo pipefail
          mkdir -p art/sources
          curl -fsSL --retry 3 "$SOURCE_URL" -o art/sources/v457-original-spells.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('art/sources/v457-original-spells.png')
          im=Image.open(p);im.verify()
          im=Image.open(p)
          w,h=im.size
          assert min(w,h)>=1024 and abs(w-h)/max(w,h)<=.09, im.size
          assert p.stat().st_size>100_000, p.stat().st_size
          print('Original v457 source valid:', im.size)
          PY
      - name: Archive immutable source only on staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/sources/v457-original-spells.png
          git commit -m "Archive original four-scene painted v4.5.7 spell art"
          git push origin HEAD:dev/v457-four-spells
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-v457-original-spell-source
          path: art/sources/v457-original-spells.png
          retention-days: 7
