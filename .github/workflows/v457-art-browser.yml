name: Dominion v4.5.7 painted spell build and iPhone-sized QA
on:
  push:
    branches: [dev/v457-four-spells]
    paths:
      - .github/workflows/v457-art-browser.yml
      - art/sources/v457-original-spells.png
      - tools/v457_build_spell_art.py
      - tools/v457_browser_qa.mjs
      - v457-spell-art.js
      - v45-engine.js
      - v45-qa-engine.js
      - v45-scene.js
      - v45-qa-scene.js
      - index.html
      - qa-v39.html
permissions: {contents: write}
jobs:
  production-painting-and-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev/v457-four-spells}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pillow==11.3.0
      - name: Create exact four original 128x96 spell paintings
        run: python tools/v457_build_spell_art.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/dominion-v457-http.log 2>&1 &
      - name: Real painted Grimoire, game mechanics, Armory and spell FX
        run: node tools/v457_browser_qa.mjs
        env:
          V457_RELEASE: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-v457-real-spell-art-and-field-review
          path: |
            art/v457-four-painted-spell-review-390px.png
            art/v457-four-spell-battle-fx-390px.png
            art/v457-staged-grimoire-390px.png
            art/v457-painted-56-card-preview-390px.png
          if-no-files-found: ignore
      - name: Commit original derived painted assets only to staging
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/cards-spells-v457.webp art/v457-spell-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Build painted Gravemire, Prism, Cinder and Tidal spell art from original"
            git push origin HEAD:dev/v457-four-spells
          fi
