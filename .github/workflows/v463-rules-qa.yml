name: Dominion v4.6.3 Rift Flux, save and gameplay regression
on:
  push:
    branches: [dev/v463-rotating-omens]
    paths:
      - .github/workflows/v463-rules-qa.yml
      - tools/v463_rules_qa.mjs
      - v45-engine.js
      - v45-qa-engine.js
      - DOMINION_ROADMAP.md
      - tools/v463_release_guard.mjs
      - index.html
      - v30.html
      - v463-flux.css
      - v46-gauntlet.js
      - sw.js
      - V463_RIFT_FLUX_RELEASE_AND_QA.md
permissions: {contents: read}
jobs:
  flux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/v463_rules_qa.mjs
      - run: node tools/v463_release_guard.mjs
      - run: |
          cmp v45-engine.js v45-qa-engine.js
          cmp v45-scene.js v45-qa-scene.js
